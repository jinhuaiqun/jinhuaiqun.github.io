# baseURL：本地预览地址。
# 部署到 GitHub Pages 时，.github/workflows/hugo.yaml 会用 --baseURL 自动覆盖成你的真实网址，
# 所以这里保持本地地址即可，无需手动改。
baseURL = "http://localhost:1313/"
locale = "zh-cn"
title = "我的自留地"
theme = "PaperMod"
enableRobotsTXT = true
enableEmoji = true
paginate = 10

# 输出格式：HTML + RSS + JSON（JSON 是站内搜索功能必需的）
[outputs]
  home = ["HTML", "RSS", "JSON"]

[params]
  env = "production"
  author = "jinhuaiqun"
  description = "记录生活，分享思考"
  DateFormat = "2006-01-02"
  defaultTheme = "auto"              # 主题：light / dark / auto（跟随系统）
  disableThemeToggle = false         # 是否禁用明暗切换按钮
  ShowReadingTime = true             # 显示阅读时长
  ShowWordCount = true               # 显示字数
  ShowBreadCrumbs = true             # 面包屑导航
  ShowToc = true                     # 文章目录
  ShowCodeCopyButtons = true         # 代码块复制按钮
  ShowPostNavLinks = true            # 上一篇/下一篇
  ShowAllPagesInArchive = true       # 归档页显示全部文章
  ShowRssButtonInSectionTermList = true
  comments = false                   # 评论（以后想加再开）

  # 站点图标（favicon）：优先 SVG，PNG/ICO 作兼容回退
  [params.assets]
    favicon = "favicon.svg"
    favicon16x16 = "favicon-16x16.png"
    favicon32x32 = "favicon-32x32.png"
    apple_touch_icon = "apple-touch-icon.png"
    safari_pinned_tab = "safari-pinned-tab.svg"

  # 首页欢迎区（Home-Info 模式，和 Lilian 的博客同款布局）
  [params.homeInfoParams]
    Title = "👋 欢迎来到我的自留地"
    Content = "把沿途所学、所想、所疑，慢慢记下，久而久之，微光亦可成炬，涓滴亦能成流。"

  # 页脚（留空即只显示主题默认的版权和开源致谢）

  # 顶部站点标识
  [params.label]
    text = "我的自留地"

  # 社交媒体图标（改成你自己的链接）
  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/YOUR-USERNAME"
  [[params.socialIcons]]
    name = "email"
    url = "mailto:you@example.com"

# 顶部导航菜单（纯文字，和 Lilian 的风格一致）
[[menu.main]]
    identifier = "posts"
    name = "文章"
    url = "/posts/"
    weight = 1
[[menu.main]]
    identifier = "archives"
    name = "归档"
    url = "/archives/"
    weight = 2
[[menu.main]]
    identifier = "search"
    name = "搜索"
    url = "/search/"
    weight = 3
[[menu.main]]
    identifier = "tags"
    name = "标签"
    url = "/tags/"
    weight = 4
[[menu.main]]
    identifier = "about"
    name = "关于"
    url = "/about/"
    weight = 5
